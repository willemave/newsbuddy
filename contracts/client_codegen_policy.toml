[settings]

# Untyped JSON is rejected unless the precise schema field is reviewed here.
untyped_fields = [
  "ErrorEnvelope.details",
  "ContentDetailResponse.feed_preview",
  "ContentDetailResponse.longform_artifact",
  "ContentDetailResponse.metadata",
  "ContentDetailResponse.structured_summary",
  "ContentSummaryResponse.feed_preview",
  "CreateUserScraperConfig.config",
  "NewsItemDetailResponse.metadata",
  "AgentOnboardingStartRequest.preferences",
  "ContentDiscussionResponse.stats",
  "JobStatusResponse.payload",
  "LearningDeckResponse.source_metadata",
  "LlmTaskActionResponse.action_input",
  "LlmTaskActionResponse.action_result",
  "RecordContentInteractionRequest.context_data",
  "ScraperConfigResponse.config",
  "UpdateUserScraperConfig.config",
]

# These older response fields deliberately tolerate an absent key. All other
# non-null fields keep strict Swift decoding even if construction has a default.
lenient_fields = [
  "ContentDetailResponse.bullet_points",
  "ContentDetailResponse.quotes",
  "ContentDetailResponse.topics",
  "MixedSearchFeedResultResponse.is_subscribed",
  "AssistantFeedOption.is_subscribed",
  "ChatMessageDto.feed_options",
  "ChatMessageDto.council_candidates",
]

