appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
      newslyE2EOpenContentType: article
      newslyE2EOpenContentId: "${CONTENT_ID}"
- extendedWaitUntil:
    visible:
      id: content.detail.screen
    timeout: 15000
# Wait for the summary to render so the action toolbar is interactive before tapping.
- assertVisible:
    text: Notable Quotes
- tapOn:
    id: content.action.knowledge_actions
- extendedWaitUntil:
    visible:
      id: content.knowledge_actions.sheet
    timeout: 15000
- tapOn:
    id: content.knowledge_actions.council
- assertVisible:
    text: Initial mocked assistant reply.
- assertVisible:
    text: ${PRIMARY_PERSONA_NAME}
- assertVisible:
    text: ${SECONDARY_PERSONA_NAME}
- assertVisible:
    text: ${PRIMARY_PERSONA_REPLY}
- tapOn:
    text: ${SECONDARY_PERSONA_NAME}
- assertVisible:
    text: ${SECONDARY_PERSONA_REPLY}
