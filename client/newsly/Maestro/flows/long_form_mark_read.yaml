appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
- extendedWaitUntil:
    visible:
      id: briefing.screen
    timeout: 15000
- tapOn:
    id: briefing.lens.articles
- extendedWaitUntil:
    visible:
      id: briefing.segment.${SEGMENT_ID}
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- longPressOn:
    id: briefing.lens.articles
- extendedWaitUntil:
    visible: Mark All as Read
    timeout: 5000
- tapOn: Mark All as Read
- extendedWaitUntil:
    notVisible:
      id: briefing.category.mark_all.progress
    timeout: 10000
- assertVisible:
    id: briefing.screen
