appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
      newslyE2EOpenContentType: news
      newslyE2EOpenContentId: "${CONTENT_ID}"
- scrollUntilVisible:
    element:
      id: content.comments.topic
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      id: content.comments.topic
    timeout: 10000
- assertVisible: "Comments"
- assertVisible: "${TOPIC_STANCE}"
- assertVisible: "${TOPIC_SUMMARY}"
- assertVisible:
    id: content.comments.open_original
