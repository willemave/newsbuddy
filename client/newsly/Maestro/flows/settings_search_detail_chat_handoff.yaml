appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
- tapOn:
    id: tab.knowledge
- extendedWaitUntil:
    visible:
      id: knowledge.screen
    timeout: 15000
- tapOn:
    id: knowledge.settings
- extendedWaitUntil:
    visible:
      id: settings.screen
    timeout: 8000
- tapOn:
    id: settings.search
- extendedWaitUntil:
    visible:
      id: search.input
    timeout: 8000
- tapOn:
    id: search.input
- inputText: "${QUERY}"
- extendedWaitUntil:
    visible:
      id: search.content.${CONTENT_ID}
    timeout: 15000
- tapOn:
    id: search.content.${CONTENT_ID}
- extendedWaitUntil:
    visible:
      id: content.detail.screen
    timeout: 10000
- tapOn:
    id: content.action.knowledge_actions
- extendedWaitUntil:
    visible:
      id: content.knowledge_actions.sheet
    timeout: 8000
- tapOn:
    id: content.knowledge_actions.start_chat
- extendedWaitUntil:
    visible:
      id: knowledge.chat_input
    timeout: 12000
- assertNotVisible:
    id: settings.screen
