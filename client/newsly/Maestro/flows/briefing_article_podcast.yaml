appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
- extendedWaitUntil:
    visible:
      id: briefing.screen
    timeout: 15000
- assertVisible:
    id: briefing.lens.podcasts
- assertVisible:
    id: briefing.lens.articles
- extendedWaitUntil:
    visible:
      id: briefing.lens_page.podcasts
    timeout: 10000
- assertVisible:
    id: briefing.segment.${PODCAST_SEGMENT_ID}
- assertVisible: "${PODCAST_TITLE}"
- tapOn:
    id: briefing.lens.articles
- extendedWaitUntil:
    visible:
      id: briefing.lens_page.articles
    timeout: 10000
- assertVisible:
    id: briefing.segment.${ARTICLE_SEGMENT_ID}
- assertVisible: "${ARTICLE_TITLE}"
- tapOn: "${ARTICLE_TITLE}"
- extendedWaitUntil:
    visible:
      id: content.detail.screen
    timeout: 10000
- tapOn:
    id: content.action.knowledge_actions
- extendedWaitUntil:
    visible:
      id: content.knowledge_actions.sheet
    timeout: 10000
- tapOn:
    id: content.knowledge_actions.start_chat
- extendedWaitUntil:
    visible:
      id: chat.header
    timeout: 10000
- assertNotVisible:
    id: tab.knowledge
