name: Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Validate release commit
    uses: ./.github/workflows/quality-gate.yml
    with:
      sha: ${{ github.sha }}

  build-image:
    name: Build tested image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TESTED_SHA: ${{ needs.quality.outputs.tested_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify tested commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main_sha" != "$TESTED_SHA" ]]; then
            echo "Refusing stale build: tested $TESTED_SHA, current main $current_main_sha" >&2
            exit 1
          fi

      - name: Validate production Compose manifest
        env:
          NEWSLY_DATABASE_URL: postgresql://newsly:newsly@postgres:5432/newsly
          DOCUMENT_EXTRACTOR_SHARED_SECRET: manifest-validation-only
          NEWSLY_ENV_FILE: /dev/null
          NEWSLY_EXTRACTOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}-extractor
          NEWSLY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}
          POSTGRES_PASSWORD: manifest-validation-only
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEWSLY_BUILD_SHA=${{ env.TESTED_SHA }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TESTED_SHA }}
          cache-from: type=gha,scope=newsly-rust-image
          cache-to: type=gha,mode=max,scope=newsly-rust-image

      - name: Build database-free document extractor image
        uses: docker/build-push-action@v6
        with:
          context: ./python/document_extractor
          file: ./python/document_extractor/Dockerfile
          push: true
          build-args: |
            NEWSLY_BUILD_SHA=${{ env.TESTED_SHA }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}-extractor
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TESTED_SHA }}
          cache-from: type=gha,scope=document-extractor
          cache-to: type=gha,mode=max,scope=document-extractor

  deploy:
    name: Deploy tested image to production
    needs:
      - quality
      - build-image
    runs-on: ubuntu-latest
    concurrency: news-app-docker-deploy
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TESTED_SHA: ${{ needs.quality.outputs.tested_sha }}
      DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Verify tested commit is current main
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main_sha" != "$TESTED_SHA" ]]; then
            echo "Refusing stale deploy: tested $TESTED_SHA, current main $current_main_sha" >&2
            exit 1
          fi

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust remote host key
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo and deploy blue-green stack
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_EXTRACTOR_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}-extractor
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TESTED_SHA }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_SSH_USER:-}" || -z "${DEPLOY_SSH_HOST:-}" ]]; then
            echo "DEPLOY_SSH_USER and DEPLOY_SSH_HOST secrets are required" >&2
            exit 1
          fi
          if [[ -z "${GHCR_TOKEN:-}" || -z "${GHCR_USERNAME:-}" ]]; then
            echo "GHCR token and username are required for remote image pull" >&2
            exit 1
          fi

          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE_DIR="${DEPLOY_REMOTE_DIR:-/opt/news_app}"
          OWNER_GROUP="${DEPLOY_SSH_USER}:${DEPLOY_SSH_USER}"

          EXCLUDES=(
            ".git/"
            ".github/"
            ".worktrees/"
            ".venv/"
            "archive/"
            "client/"
            "data/"
            "logs/"
            "logs_from_server/"
            "node_modules/"
            "__pycache__/"
            ".ruff_cache/"
            ".pytest_cache/"
            "*.pyc"
            "*.pyo"
            "*.db"
            "*.sqlite"
            ".DS_Store"
            ".env"
            ".env.docker"
            ".env.docker.local"
            ".env.local"
            "docker/local-data/"
          )
          PROTECTED_PATHS=(
            ".env.racknerd"
          )

          ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo mkdir -p '$REMOTE_DIR' && sudo chown '$OWNER_GROUP' '$REMOTE_DIR' && sudo chmod 755 '$REMOTE_DIR'"

          RSYNC_ARGS=(-az --delete --rsync-path="sudo rsync" --info=progress2 --chown="$OWNER_GROUP" -e "ssh -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes")
          for ex in "${EXCLUDES[@]}"; do
            RSYNC_ARGS+=(--exclude "$ex")
          done
          for protected_path in "${PROTECTED_PATHS[@]}"; do
            RSYNC_ARGS+=(--filter "P $protected_path")
          done
          rsync "${RSYNC_ARGS[@]}" ./ "$REMOTE:$REMOTE_DIR/"

          echo "→ Verifying RackNerd env file"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s -- "$REMOTE_DIR" <<'REMOTE_ENV_CHECK'
          set -euo pipefail
          remote_dir="$1"
          env_file="$remote_dir/.env.racknerd"
          if [[ ! -f "$env_file" ]]; then
            echo ".env.racknerd is required for deploy" >&2
            exit 1
          fi
          for key in POSTGRES_PASSWORD NEWSLY_DATABASE_URL DOCUMENT_EXTRACTOR_SHARED_SECRET; do
            if ! grep -q "^${key}=" "$env_file"; then
              echo "${key} is required for deploy" >&2
              exit 1
            fi
          done
          chmod 600 "$env_file"
          test -x "$remote_dir/scripts/deploy_blue_green.sh"
          test -x "$remote_dir/scripts/deploy/switch-api-slot.sh"
          mkdir -p /data /opt/newsly/bin /opt/newsly/state
          install -m 755 "$remote_dir/scripts/deploy/switch-api-slot.sh" \
            /opt/newsly/bin/switch-api-slot
          REMOTE_ENV_CHECK

          echo "→ Logging in to GitHub Container Registry on remote host"
          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo docker login '$REGISTRY' --username '$GHCR_USERNAME' --password-stdin >/dev/null"

          echo "→ Pulling images on remote host"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s -- "$IMAGE_TAG" "$IMAGE_EXTRACTOR_TAG" <<'REMOTE_PULL'
          set -euo pipefail
          for image_tag in "$@"; do
            pulled=false
            for attempt in 1 2 3 4 5; do
              if docker pull "$image_tag"; then
                pulled=true
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "docker pull failed for $image_tag after $attempt attempts" >&2
                exit 1
              fi
              sleep_seconds=$((attempt * 5))
              echo "docker pull attempt $attempt failed for $image_tag; retrying in ${sleep_seconds}s" >&2
              sleep "$sleep_seconds"
            done
            [[ "$pulled" == true ]]
          done
          REMOTE_PULL

          echo "→ Deploying inactive API slot"
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "sudo env NEWSLY_DEPLOY_APP_DIR='$REMOTE_DIR' NEWSLY_EXTRACTOR_IMAGE='$IMAGE_EXTRACTOR_TAG' '$REMOTE_DIR/scripts/deploy_blue_green.sh' '$IMAGE_TAG'"

          echo "→ Verifying production runtime"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s <<'REMOTE_VERIFY'
          set -euo pipefail
          active_slot="$(tr -d '[:space:]' < /opt/newsly/state/active-api-slot)"
          case "$active_slot" in
            blue) active_port=8001 ;;
            green) active_port=8002 ;;
            *) echo "invalid active API slot: $active_slot" >&2; exit 1 ;;
          esac

          for container in newsly-postgres newsly-document-extractor "newsly-api-${active_slot}" newsly-workers newsly-scheduler; do
            status="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [[ "$status" != "running" ]]; then
              echo "$container is not running: $status" >&2
              exit 1
            fi
          done
          postgres_health="$(docker inspect --format '{{.State.Health.Status}}' newsly-postgres)"
          extractor_health="$(docker inspect --format '{{.State.Health.Status}}' newsly-document-extractor)"
          api_health="$(docker inspect --format '{{.State.Health.Status}}' "newsly-api-${active_slot}")"
          [[ "$postgres_health" == "healthy" ]]
          [[ "$extractor_health" == "healthy" ]]
          [[ "$api_health" == "healthy" ]]
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${active_port}/health" >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/health >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/server-health >/dev/null
          docker ps --filter name=newsly- --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          REMOTE_VERIFY

          echo "→ Cleaning up unreferenced deployment images"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s -- "$IMAGE_REPOSITORY" <<'REMOTE_CLEANUP'
          set -euo pipefail
          image_repository="$1"
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            if [[ -z "$(docker ps -aq --filter "ancestor=$image")" ]]; then
              docker rmi "$image" || true
            fi
          done < <(docker images "$image_repository" --format '{{.Repository}}:{{.Tag}}')
          docker image prune -f
          docker builder prune -af
          docker system df
          REMOTE_CLEANUP
