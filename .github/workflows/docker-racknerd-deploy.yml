name: Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build image and deploy to RackNerd
    runs-on: ubuntu-latest
    concurrency: news-app-docker-deploy
    environment: production
    env:
      DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR }}
      DEPLOY_OWNER_GROUP: ${{ vars.DEPLOY_OWNER_GROUP }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: newsly:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust remote host key
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo and deploy container
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          IMAGE_TAG: newsly:${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_SSH_USER:-}" || -z "${DEPLOY_SSH_HOST:-}" ]]; then
            echo "DEPLOY_SSH_USER and DEPLOY_SSH_HOST secrets are required" >&2
            exit 1
          fi

          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE_DIR="${DEPLOY_REMOTE_DIR:-/opt/news_app}"
          OWNER_GROUP="${DEPLOY_OWNER_GROUP:-newsapp:newsapp}"

          EXCLUDES=(
            ".git/"
            ".github/"
            ".worktrees/"
            ".venv/"
            "archive/"
            "client/"
            "data/"
            "logs/"
            "logs_from_server/"
            "node_modules/"
            "__pycache__/"
            ".ruff_cache/"
            ".pytest_cache/"
            "*.pyc"
            "*.pyo"
            "*.db"
            "*.sqlite"
            ".DS_Store"
            ".env"
            ".env.docker"
            ".env.docker.local"
            ".env.local"
            "docker/local-data/"
          )
          PROTECTED_PATHS=(
            ".env.racknerd"
          )

          ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo mkdir -p '$REMOTE_DIR' && sudo chown '$OWNER_GROUP' '$REMOTE_DIR' && sudo chmod 755 '$REMOTE_DIR'"

          RSYNC_ARGS=(-az --delete --rsync-path="sudo rsync" --info=progress2 --chown="$OWNER_GROUP" -e "ssh -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes")
          for ex in "${EXCLUDES[@]}"; do
            RSYNC_ARGS+=(--exclude "$ex")
          done
          for protected_path in "${PROTECTED_PATHS[@]}"; do
            RSYNC_ARGS+=(--filter "P $protected_path")
          done
          rsync "${RSYNC_ARGS[@]}" ./ "$REMOTE:$REMOTE_DIR/"

          echo "→ Verifying RackNerd env file"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "bash -lc '
            set -euo pipefail
            cd \"$REMOTE_DIR\"
            if [[ ! -f .env.racknerd ]]; then
              echo \".env.racknerd is required for deploy\" >&2
              exit 1
            fi
            if grep -q \"^ENVIRONMENT=production$\" .env.racknerd; then
              if ! grep -q \"^CORS_ALLOW_ORIGINS=\" .env.racknerd; then
                echo \"CORS_ALLOW_ORIGINS is required when ENVIRONMENT=production\" >&2
                exit 1
              fi
              if grep -q \"^CORS_ALLOW_ORIGINS=\\*$\" .env.racknerd; then
                echo \"CORS_ALLOW_ORIGINS must be explicit when ENVIRONMENT=production\" >&2
                exit 1
              fi
            fi
            sudo chmod 600 .env.racknerd
            sudo mkdir -p /data
          '"

          remote_cleanup_docker() {
            ssh "${SSH_OPTS[@]}" "$REMOTE" "bash -lc '
              set -euo pipefail
              current_image=\$(sudo docker inspect --format \"{{.Config.Image}}\" newsly 2>/dev/null || true)
              if [[ -n \"\${current_image}\" ]]; then
                sudo docker images --format \"{{.Repository}}:{{.Tag}}\" \
                  | awk '\''\$1 ~ /^newsly:/ { print \$1 }'\'' \
                  | grep -Fvx \"\${current_image}\" \
                  | xargs -r sudo docker rmi || true
              fi
              sudo docker images --filter dangling=true -q | xargs -r sudo docker rmi || true
              sudo docker builder prune -af || true
              sudo docker container prune -f || true
              sudo docker system df || true
            '"
          }

          echo "→ Cleaning up unused remote Docker artifacts before image load"
          remote_cleanup_docker

          echo "→ Streaming image to remote host"
          docker save "$IMAGE_TAG" | gzip | ssh "${SSH_OPTS[@]}" "$REMOTE" "gunzip | sudo docker load"

          echo "→ Restarting Docker stack"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "bash -lc '
            set -euo pipefail
            cd \"$REMOTE_DIR\"
            sudo env NEWSLY_IMAGE=\"$IMAGE_TAG\" NEWSLY_ENV_FILE=.env.racknerd docker compose --env-file .env.racknerd down --remove-orphans || true
            sudo env NEWSLY_IMAGE=\"$IMAGE_TAG\" NEWSLY_ENV_FILE=.env.racknerd docker compose --env-file .env.racknerd up -d
          '"

          echo "→ Verifying container health"
          for attempt in $(seq 1 30); do
            STATUS=$(ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' newsly" 2>/dev/null || true)
            echo "Health attempt $attempt/30: ${STATUS:-unknown}"
            if [[ "$STATUS" == "healthy" ]]; then
              echo "→ Cleaning up superseded remote Docker images"
              remote_cleanup_docker
              ssh "${SSH_OPTS[@]}" "$REMOTE" "cd '$REMOTE_DIR' && sudo env NEWSLY_IMAGE='$IMAGE_TAG' NEWSLY_ENV_FILE=.env.racknerd docker compose --env-file .env.racknerd ps"
              exit 0
            fi
            if [[ $attempt -eq 30 ]]; then
              echo "Container failed to become healthy" >&2
              ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo docker logs --tail 200 newsly || true"
              exit 1
            fi
            sleep 10
          done
