name: Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build image and deploy to production
    runs-on: ubuntu-latest
    concurrency: news-app-docker-deploy
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust remote host key
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo and deploy blue-green stack
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_SSH_USER:-}" || -z "${DEPLOY_SSH_HOST:-}" ]]; then
            echo "DEPLOY_SSH_USER and DEPLOY_SSH_HOST secrets are required" >&2
            exit 1
          fi
          if [[ -z "${GHCR_TOKEN:-}" || -z "${GHCR_USERNAME:-}" ]]; then
            echo "GHCR token and username are required for remote image pull" >&2
            exit 1
          fi

          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE_DIR="${DEPLOY_REMOTE_DIR:-/opt/news_app}"
          OWNER_GROUP="${DEPLOY_SSH_USER}:${DEPLOY_SSH_USER}"

          EXCLUDES=(
            ".git/"
            ".github/"
            ".worktrees/"
            ".venv/"
            "archive/"
            "client/"
            "data/"
            "logs/"
            "logs_from_server/"
            "node_modules/"
            "__pycache__/"
            ".ruff_cache/"
            ".pytest_cache/"
            "*.pyc"
            "*.pyo"
            "*.db"
            "*.sqlite"
            ".DS_Store"
            ".env"
            ".env.docker"
            ".env.docker.local"
            ".env.local"
            "docker/local-data/"
          )
          PROTECTED_PATHS=(
            ".env.racknerd"
          )

          ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo mkdir -p '$REMOTE_DIR' && sudo chown '$OWNER_GROUP' '$REMOTE_DIR' && sudo chmod 755 '$REMOTE_DIR'"

          RSYNC_ARGS=(-az --delete --rsync-path="sudo rsync" --info=progress2 --chown="$OWNER_GROUP" -e "ssh -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes")
          for ex in "${EXCLUDES[@]}"; do
            RSYNC_ARGS+=(--exclude "$ex")
          done
          for protected_path in "${PROTECTED_PATHS[@]}"; do
            RSYNC_ARGS+=(--filter "P $protected_path")
          done
          rsync "${RSYNC_ARGS[@]}" ./ "$REMOTE:$REMOTE_DIR/"

          echo "→ Verifying RackNerd env file"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s -- "$REMOTE_DIR" <<'REMOTE_ENV_CHECK'
          set -euo pipefail
          remote_dir="$1"
          env_file="$remote_dir/.env.racknerd"
          if [[ ! -f "$env_file" ]]; then
            echo ".env.racknerd is required for deploy" >&2
            exit 1
          fi
          for key in POSTGRES_PASSWORD NEWSLY_DATABASE_URL; do
            if ! grep -q "^${key}=" "$env_file"; then
              echo "${key} is required for deploy" >&2
              exit 1
            fi
          done
          if grep -q '^ENVIRONMENT=production$' "$env_file"; then
            if ! grep -q '^CORS_ALLOW_ORIGINS=' "$env_file"; then
              echo "CORS_ALLOW_ORIGINS is required when ENVIRONMENT=production" >&2
              exit 1
            fi
            if grep -q '^CORS_ALLOW_ORIGINS=\*$' "$env_file"; then
              echo "CORS_ALLOW_ORIGINS must be explicit when ENVIRONMENT=production" >&2
              exit 1
            fi
          fi
          chmod 600 "$env_file"
          test -x "$remote_dir/scripts/deploy_blue_green.sh"
          test -x "$remote_dir/scripts/deploy/switch-api-slot.sh"
          mkdir -p /data /opt/newsly/bin /opt/newsly/state
          install -m 755 "$remote_dir/scripts/deploy/switch-api-slot.sh" \
            /opt/newsly/bin/switch-api-slot
          REMOTE_ENV_CHECK

          echo "→ Logging in to GitHub Container Registry on remote host"
          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo docker login '$REGISTRY' --username '$GHCR_USERNAME' --password-stdin >/dev/null"

          echo "→ Pulling image on remote host"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "sudo docker pull '$IMAGE_TAG'"

          echo "→ Deploying inactive API slot"
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "sudo env NEWSLY_DEPLOY_APP_DIR='$REMOTE_DIR' '$REMOTE_DIR/scripts/deploy_blue_green.sh' '$IMAGE_TAG'"

          echo "→ Verifying production runtime"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s <<'REMOTE_VERIFY'
          set -euo pipefail
          active_slot="$(tr -d '[:space:]' < /opt/newsly/state/active-api-slot)"
          case "$active_slot" in
            blue) active_port=8001 ;;
            green) active_port=8002 ;;
            *) echo "invalid active API slot: $active_slot" >&2; exit 1 ;;
          esac

          for container in newsly-postgres "newsly-api-${active_slot}" newsly-workers newsly-scheduler; do
            status="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [[ "$status" != "running" ]]; then
              echo "$container is not running: $status" >&2
              exit 1
            fi
          done
          postgres_health="$(docker inspect --format '{{.State.Health.Status}}' newsly-postgres)"
          api_health="$(docker inspect --format '{{.State.Health.Status}}' "newsly-api-${active_slot}")"
          [[ "$postgres_health" == "healthy" ]]
          [[ "$api_health" == "healthy" ]]
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${active_port}/health" >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/health >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/server-health >/dev/null
          docker ps --filter name=newsly- --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          REMOTE_VERIFY

          echo "→ Cleaning up unreferenced deployment images"
          ssh "${SSH_OPTS[@]}" "$REMOTE" sudo bash -s -- "$IMAGE_REPOSITORY" <<'REMOTE_CLEANUP'
          set -euo pipefail
          image_repository="$1"
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            if [[ -z "$(docker ps -aq --filter "ancestor=$image")" ]]; then
              docker rmi "$image" || true
            fi
          done < <(docker images "$image_repository" --format '{{.Repository}}:{{.Tag}}')
          docker image prune -f
          docker builder prune -af
          docker system df
          REMOTE_CLEANUP
