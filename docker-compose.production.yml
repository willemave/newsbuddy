name: newsly-prod

x-newsly-environment: &newsly-environment
  DATABASE_URL: ${NEWSLY_DATABASE_URL:?NEWSLY_DATABASE_URL is required}
  NEWSLY_WAIT_FOR_BOOTSTRAP: "false"
  PORT: "8000"

x-newsly-app: &newsly-app
  image: ${NEWSLY_IMAGE:?NEWSLY_IMAGE is required}
  init: true
  restart: unless-stopped
  env_file:
    - ${NEWSLY_ENV_FILE:-.env.racknerd}
  volumes:
    - /data:/data:z
  networks:
    - newsly-internal

services:
  postgres:
    image: ${NEWSLY_POSTGRES_IMAGE:-postgres:15.18-bookworm}
    container_name: newsly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsly}
      POSTGRES_USER: ${POSTGRES_USER:-newsly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 2m
    networks:
      - newsly-internal

  migrate:
    <<: *newsly-app
    profiles: ["ops"]
    restart: "no"
    environment:
      <<: *newsly-environment
      NEWSLY_RUNTIME_MODE: migrate
    healthcheck:
      disable: true

  api_blue:
    <<: *newsly-app
    container_name: newsly-api-blue
    environment:
      <<: *newsly-environment
      NEWSLY_RUNTIME_MODE: api
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 2m

  api_green:
    <<: *newsly-app
    container_name: newsly-api-green
    environment:
      <<: *newsly-environment
      NEWSLY_RUNTIME_MODE: api
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 2m

  workers:
    <<: *newsly-app
    container_name: newsly-workers
    environment:
      <<: *newsly-environment
      NEWSLY_RUNTIME_MODE: workers
    healthcheck:
      disable: true
    stop_grace_period: 10m

  scheduler:
    <<: *newsly-app
    container_name: newsly-scheduler
    environment:
      <<: *newsly-environment
      NEWSLY_RUNTIME_MODE: scheduler
    healthcheck:
      disable: true
    stop_grace_period: 2m

networks:
  newsly-internal:
    name: newsly-internal
    external: true
