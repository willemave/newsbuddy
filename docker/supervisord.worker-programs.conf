[program:worker_content]
command=/app/docker/run-worker.sh content %(process_num)s
process_name=%(program_name)s_%(process_num)s
numprocs=4
numprocs_start=1
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

