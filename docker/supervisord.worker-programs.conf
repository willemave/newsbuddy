; Serial consumers: news extraction 2, processing 2, shared lenses 2.
; Every serial worker uses at most 2 pooled connections
; plus 1 notification listener. With 23 workers the ceiling is 69 connections.
; Production reserves 5 per API slot and 2 for the scheduler: 81 total, leaving
; 19 of PostgreSQL's default 100 for reserved, migration and operator connections.
; Queue claims serialize Briefing per owner; different owners use two consumers.
; NEWSLY_BRIEFING_REFRESH_CONSUMERS may select 1 or 2.
[program:rust_worker_content]
command=/usr/local/bin/newsly-content-worker
environment=NEWSLY_RUST_WORKER_DATABASE_MAX_CONNECTIONS="2",NEWSLY_RUST_WORKER_DATABASE_MIN_CONNECTIONS="0"
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

