appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
      newslyE2EFakeSpeechEnabled: true
      newslyE2EFakeSpeechTranscript: "${TRANSCRIPT}"
- tapOn:
    id: tab.knowledge
- assertVisible:
    id: knowledge.chat.mic
- tapOn:
    id: knowledge.chat.mic
- tapOn:
    id: knowledge.chat.mic
- assertVisible:
    id: knowledge.chat_input
- assertVisible:
    id: knowledge.chat_mic
