appId: "${APP_ID}"
---
- tapOn:
    id: long.row.${CONTENT_ID}
- extendedWaitUntil:
    visible:
      id: content.detail.screen
    timeout: 15000
- assertVisible:
    id: content.detail.title.${CONTENT_ID}
- swipe:
    start: 50%, 84%
    end: 50%, 28%
    duration: 500
- swipe:
    start: 92%, 55%
    end: 18%, 55%
    duration: 450
- waitForAnimationToEnd
