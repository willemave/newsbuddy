appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
      newslyE2EVisualNow: "${VISUAL_NOW}"
      newslyE2EOpenContentType: news
      newslyE2EOpenContentId: "${NEWS_ITEM_ID}"
- extendedWaitUntil:
    visible:
      id: content.detail.screen
    timeout: 15000
- tapOn:
    id: content.discussion.scroll_to_comments
- extendedWaitUntil:
    visible:
      id: content.discussion.open
    timeout: 10000
- tapOn:
    id: content.discussion.open
- extendedWaitUntil:
    visible:
      id: content.discussion.sheet
    timeout: 10000
- assertVisible:
    id: content.discussion.comment.${COMMENT_ID}
- takeScreenshot:
    path: "${BASELINE_DIR}/modal-discussion"
    cropOn:
      id: content.discussion.sheet
