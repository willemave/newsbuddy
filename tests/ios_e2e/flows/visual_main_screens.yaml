appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: true
      newslyE2ECompleteTutorial: true
      newslyE2EVisualNow: "${VISUAL_NOW}"
- extendedWaitUntil:
    visible:
      id: briefing.screen
    timeout: 15000
- assertVisible:
    id: briefing.lens_page.articles
- assertVisible:
    id: briefing.segment.${ARTICLE_SEGMENT_ID}
- assertScreenshot:
    path: "${BASELINE_DIR}/briefing-articles.png"
    thresholdPercentage: 94
- tapOn:
    id: briefing.tier.news
- extendedWaitUntil:
    visible:
      id: briefing.lens_page.ai-hardware
    timeout: 10000
- assertVisible:
    id: briefing.segment.${NEWS_SEGMENT_ID}
- assertScreenshot:
    path: "${BASELINE_DIR}/briefing-news.png"
    thresholdPercentage: 94
- tapOn:
    id: tab.knowledge
- extendedWaitUntil:
    visible:
      id: knowledge.screen
    timeout: 15000
- assertVisible: Recently Saved
- assertVisible:
    id: knowledge.saved.${LONG_CONTENT_ID}
- waitForAnimationToEnd
- assertScreenshot:
    path: "${BASELINE_DIR}/redesign-knowledge.png"
    thresholdPercentage: 94
- tapOn:
    id: tab.learning
- extendedWaitUntil:
    visible:
      id: learning.screen
    timeout: 15000
- assertVisible:
    id: learning.chat.${CHAT_SESSION_ID}
- assertVisible:
    id: learning.deck.1
- assertVisible:
    id: learning.narration.1
- waitForAnimationToEnd
- assertScreenshot:
    path: "${BASELINE_DIR}/redesign-learning.png"
    thresholdPercentage: 94
- tapOn:
    id: learning.more_menu
- extendedWaitUntil:
    visible:
      id: more.screen
    timeout: 15000
- assertVisible: Settings
- assertScreenshot:
    path: "${BASELINE_DIR}/main-more.png"
    thresholdPercentage: 94
