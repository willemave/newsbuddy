appId: "${APP_ID}"
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      newslyE2EEnabled: true
      newslyE2EAutoLogin: true
      newslyE2EServerHost: "${SERVER_HOST}"
      newslyE2EServerPort: "${SERVER_PORT}"
      newslyE2EUseHTTPS: false
      newslyE2EUserId: "${USER_ID}"
      newslyE2ECompleteOnboarding: false
      newslyE2ECompleteTutorial: false
      newslyE2EFakeSpeechEnabled: true
      newslyE2EFakeSpeechTranscript: "${TRANSCRIPT}"
- assertVisible:
    id: onboarding.choice.screen
- tapOn:
    id: onboarding.choice.personalized
- assertVisible:
    id: onboarding.audio.screen
- assertVisible:
    id: onboarding.audio.state.recording
- tapOn:
    id: onboarding.audio.mic
- extendedWaitUntil:
    visible:
      id: onboarding.suggestions.screen
    timeout: 30000
- assertVisible:
    id: onboarding.suggestions.screen
- assertVisible:
    id: "onboarding.suggestion.https://stratechery.com/feed"
- assertVisible:
    id: "onboarding.suggestion.https://www.latent.space/feed"
- tapOn:
    id: "onboarding.suggestion.https://www.latent.space/feed"
- tapOn:
    id: onboarding.suggestions.continue
- assertVisible:
    id: onboarding.aggregators.screen
- tapOn:
    id: onboarding.aggregators.continue
- assertVisible:
    id: onboarding.reddit.screen
- tapOn:
    id: onboarding.complete
- extendedWaitUntil:
    visible:
      id: briefing.screen
    timeout: 15000
