# Lefthook keeps the repo's local git hooks in one tracked config.
# Install with: `npx lefthook install`

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: module size guardrails
      run: scripts/check_module_size_guardrails.sh

    - name: ruff check
      glob: "**/*.py"
      run: uvx --from ruff==0.11.12 ruff check --fix {staged_files}
      stage_fixed: true

    - name: ruff format
      glob: "**/*.py"
      run: uvx --from ruff==0.11.12 ruff format {staged_files}
      stage_fixed: true

    - name: Rust format
      glob: "rust/**/*.rs"
      run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
