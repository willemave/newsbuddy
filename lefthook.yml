# Lefthook keeps the repo's local git hooks in one tracked config.
# Install with: `npx lefthook install`

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: module size guardrails
      run: scripts/check_module_size_guardrails.sh

    - name: evals ruff check
      glob: "python/evals/**/*.py"
      run: uv run --project python/evals ruff check --fix {staged_files}
      stage_fixed: true

    - name: evals ruff format
      glob: "python/evals/**/*.py"
      run: uv run --project python/evals ruff format {staged_files}
      stage_fixed: true

    - name: extractor ruff check
      glob: "python/document_extractor/**/*.py"
      run: uv run --project python/document_extractor ruff check --fix {staged_files}
      stage_fixed: true

    - name: extractor ruff format
      glob: "python/document_extractor/**/*.py"
      run: uv run --project python/document_extractor ruff format {staged_files}
      stage_fixed: true

    - name: Rust format
      glob: "rust/**/*.rs"
      run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
