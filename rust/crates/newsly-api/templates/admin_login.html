<main class="login"><h1>Newsly Operator Login</h1><p>Private operator console. Authorized access only.</p>
<form id="login-form"><label for="password">Password</label><input type="password" id="password" name="password" required autofocus placeholder="Admin password">
<div id="error-message" class="hidden"></div><button type="submit" id="submit-btn">Sign In</button></form><p><a href="/">Back to Home</a></p></main>
  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      try {
        const response = await fetch('/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await response.json();
        if (response.ok) {
          const requested = new URLSearchParams(window.location.search).get('next');
          window.location.href = requested && requested.startsWith('/') && !requested.startsWith('//') ? requested : '/admin/';
        } else {
          errorMessage.textContent = data.message || data.detail || 'Invalid password';
          errorMessage.classList.remove('hidden');
          passwordInput.focus();
          passwordInput.select();
        }
      } catch (_error) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body></html>
